<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customer Success Dashboard</title>
<style>
  :root {
    color-scheme: light;
    --surface-0: #f4f3ef;
    --surface-1: #fcfcfb;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #77766f;
    --hairline: #e1e0d9;
    --border: rgba(11,11,11,0.10);
    --good: #0ca30c;
    --warning: #fab219;
    --critical: #d03b3b;
    --delta-up: #006300;
    --delta-down: #b02a2a;
    --tooltip-bg: #0b0b0b;
    --tooltip-fg: #f0efec;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface-0: #111110;
      --surface-1: #1a1a19;
      --text-primary: #f0efec;
      --text-secondary: #c3c2b7;
      --text-muted: #9a998f;
      --hairline: #2c2c2a;
      --border: rgba(255,255,255,0.10);
      --delta-up: #0ca30c;
      --delta-down: #ec6a6a;
      --tooltip-bg: #f0efec;
      --tooltip-fg: #0b0b0b;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-0: #111110;
    --surface-1: #1a1a19;
    --text-primary: #f0efec;
    --text-secondary: #c3c2b7;
    --text-muted: #9a998f;
    --hairline: #2c2c2a;
    --border: rgba(255,255,255,0.10);
    --delta-up: #0ca30c;
    --delta-down: #ec6a6a;
    --tooltip-bg: #f0efec;
    --tooltip-fg: #0b0b0b;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--surface-0);
    color: var(--text-primary);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 32px 16px 48px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; margin-bottom: 24px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--text-secondary); font-size: 13px; }
  .badge { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--text-secondary); margin-left: 8px; vertical-align: 2px; }

  .grid { display: grid; gap: 16px; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); margin-bottom: 16px; }
  .charts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  @media (max-width: 720px) { .kpis, .charts { grid-template-columns: 1fr; } }

  .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 20px; min-width: 0; }
  .card h2 { font-size: 14px; font-weight: 600; margin: 0; }
  .card .desc { color: var(--text-muted); font-size: 12px; margin-top: 2px; }

  .kpi-value { font-size: 44px; font-weight: 650; letter-spacing: -0.02em; line-height: 1.1; margin-top: 12px; font-variant-numeric: tabular-nums; }
  .kpi-delta { font-size: 13px; margin-top: 6px; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
  .kpi-delta .up { color: var(--delta-up); font-weight: 600; }
  .kpi-delta .down { color: var(--delta-down); font-weight: 600; }
  .spark { margin-top: 14px; width: 100%; height: 40px; display: block; }

  .card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
  select { font: inherit; font-size: 13px; color: var(--text-primary); background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 4px 8px; }

  .pie-row { display: flex; align-items: center; gap: 20px; margin-top: 16px; flex-wrap: wrap; }
  .pie { width: 180px; height: 180px; flex: none; }
  .pie path { stroke: var(--surface-1); stroke-width: 2; cursor: default; transition: opacity .12s; }
  .pie.hovering path:not(.active) { opacity: .45; }
  .legend { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font-size: 13px; min-width: 150px; }
  .legend li { display: grid; grid-template-columns: 12px auto 1fr; align-items: center; gap: 8px; }
  .legend .sw { width: 12px; height: 12px; border-radius: 3px; }
  .legend .num { color: var(--text-secondary); text-align: right; font-variant-numeric: tabular-nums; }

  table { width: 100%; border-collapse: collapse; margin-top: 18px; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  th, td { padding: 6px 4px; text-align: right; border-top: 1px solid var(--hairline); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--text-muted); font-weight: 500; }
  tr.sel td { font-weight: 600; }
  tbody tr { cursor: pointer; }
  tbody tr:hover td { background: color-mix(in srgb, var(--text-primary) 4%, transparent); }

  .tooltip { position: fixed; pointer-events: none; background: var(--tooltip-bg); color: var(--tooltip-fg); font-size: 12px; padding: 6px 9px; border-radius: 6px; opacity: 0; transition: opacity .1s; white-space: nowrap; z-index: 10; }
  footer { margin-top: 24px; color: var(--text-muted); font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Customer Success Dashboard <span class="badge">Sample data</span></h1>
      <div class="sub">Trailing 12 months · as of Oct 28, 2026</div>
    </div>
    <div class="sub">All figures are fictional</div>
  </header>

  <section class="grid kpis">
    <article class="card" id="nrr"></article>
    <article class="card" id="grr"></article>
  </section>

  <section class="grid charts">
    <article class="card" id="by-vertical"></article>
    <article class="card" id="by-stage"></article>
  </section>

  <footer>Health score: Healthy ≥ 70 · At risk 40–69 · Critical &lt; 40. Fictional demo data for illustration only.</footer>
</div>
<div class="tooltip" id="tt"></div>

<script>
// ---- Fictional sample data ----
const KPIS = [
  { id: "nrr", title: "NRR", desc: "Net revenue retention (expansion − contraction − churn)",
    value: 112.4, prior: 109.8, trend: [104.1, 105.0, 106.2, 105.8, 107.3, 108.1, 108.9, 109.8, 110.6, 111.2, 111.9, 112.4] },
  { id: "grr", title: "GRR", desc: "Gross revenue retention (contraction + churn only)",
    value: 91.6, prior: 92.3, trend: [93.4, 93.1, 92.8, 92.9, 92.5, 92.6, 92.3, 92.3, 92.0, 91.8, 91.7, 91.6] },
];

const HEALTH = [
  { key: "healthy",  label: "Healthy",  color: "var(--good)" },
  { key: "atrisk",   label: "At risk",  color: "var(--warning)" },
  { key: "critical", label: "Critical", color: "var(--critical)" },
];

const BY_VERTICAL = {
  "Fintech":    { healthy: 48, atrisk: 14, critical: 6 },
  "Healthcare": { healthy: 31, atrisk: 12, critical: 7 },
  "Retail":     { healthy: 22, atrisk: 15, critical: 9 },
  "SaaS":       { healthy: 57, atrisk: 11, critical: 4 },
  "Education":  { healthy: 18, atrisk: 8,  critical: 5 },
};

const BY_STAGE = {
  "Series A":    { healthy: 41, atrisk: 24, critical: 15 },
  "Mid Market":  { healthy: 79, atrisk: 25, critical: 11 },
  "Enterprise":  { healthy: 56, atrisk: 11, critical: 5 },
};

// ---- KPI tiles ----
const tt = document.getElementById("tt");
function showTip(e, html) { tt.innerHTML = html; tt.style.opacity = 1; moveTip(e); }
function moveTip(e) {
  const pad = 14, w = tt.offsetWidth;
  const x = e.clientX + pad + w > innerWidth ? e.clientX - pad - w : e.clientX + pad;
  tt.style.left = x + "px"; tt.style.top = (e.clientY + pad) + "px";
}
function hideTip() { tt.style.opacity = 0; }

const MONTHS = ["Nov", "Dec", "Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct"];

function renderKpi(k) {
  const el = document.getElementById(k.id);
  const d = +(k.value - k.prior).toFixed(1);
  const cls = d >= 0 ? "up" : "down";
  const arrow = d >= 0 ? "▲" : "▼";
  el.innerHTML = `
    <h2>${k.title}</h2>
    <div class="desc">${k.desc}</div>
    <div class="kpi-value">${k.value.toFixed(1)}%</div>
    <div class="kpi-delta"><span class="${cls}">${arrow} ${Math.abs(d).toFixed(1)} pts</span> vs. last quarter (${k.prior.toFixed(1)}%)</div>
    <svg class="spark" viewBox="0 0 300 40" preserveAspectRatio="none" aria-label="${k.title} 12-month trend"></svg>`;
  const svg = el.querySelector("svg");
  const min = Math.min(...k.trend) - 0.5, max = Math.max(...k.trend) + 0.5;
  const xs = i => 4 + i * (292 / (k.trend.length - 1));
  const ys = v => 36 - (v - min) / (max - min) * 32;
  const pts = k.trend.map((v, i) => `${xs(i).toFixed(1)},${ys(v).toFixed(1)}`).join(" ");
  svg.innerHTML = `<polyline points="${pts}" fill="none" stroke="var(--text-secondary)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>`;
  svg.addEventListener("mousemove", e => {
    const r = svg.getBoundingClientRect();
    const i = Math.max(0, Math.min(k.trend.length - 1, Math.round((e.clientX - r.left) / r.width * (k.trend.length - 1))));
    showTip(e, `${MONTHS[i]} · <b>${k.trend[i].toFixed(1)}%</b>`);
  });
  svg.addEventListener("mouseleave", hideTip);
}
KPIS.forEach(renderKpi);

// ---- Pie charts ----
function sum(o) { return HEALTH.reduce((s, h) => s + o[h.key], 0); }
function totals(data) {
  const t = { healthy: 0, atrisk: 0, critical: 0 };
  Object.values(data).forEach(r => HEALTH.forEach(h => t[h.key] += r[h.key]));
  return t;
}

function arc(cx, cy, r, a0, a1) {
  const p = a => [cx + r * Math.sin(a), cy - r * Math.cos(a)];
  const [x0, y0] = p(a0), [x1, y1] = p(a1);
  const large = a1 - a0 > Math.PI ? 1 : 0;
  return `M${cx},${cy} L${x0.toFixed(2)},${y0.toFixed(2)} A${r},${r} 0 ${large} 1 ${x1.toFixed(2)},${y1.toFixed(2)} Z`;
}

function renderPieCard(id, title, desc, dimLabel, data) {
  const el = document.getElementById(id);
  const names = Object.keys(data);
  el.innerHTML = `
    <div class="card-head">
      <div><h2>${title}</h2><div class="desc">${desc}</div></div>
      <select aria-label="Filter by ${dimLabel}">
        <option value="__all">All ${dimLabel}s</option>
        ${names.map(n => `<option>${n}</option>`).join("")}
      </select>
    </div>
    <div class="pie-row">
      <svg class="pie" viewBox="0 0 180 180" role="img"></svg>
      <ul class="legend"></ul>
    </div>
    <table>
      <thead><tr><th>${dimLabel}</th>${HEALTH.map(h => `<th>${h.label}</th>`).join("")}<th>Total</th></tr></thead>
      <tbody>${names.map(n => `<tr data-name="${n}"><td>${n}</td>${HEALTH.map(h => `<td>${data[n][h.key]}</td>`).join("")}<td>${sum(data[n])}</td></tr>`).join("")}</tbody>
    </table>`;

  const sel = el.querySelector("select");
  const svg = el.querySelector("svg");
  const legend = el.querySelector(".legend");
  const rows = el.querySelectorAll("tbody tr");

  function draw() {
    const name = sel.value;
    const row = name === "__all" ? totals(data) : data[name];
    const total = sum(row);
    const scope = name === "__all" ? `All ${dimLabel.toLowerCase()}s` : name;
    svg.setAttribute("aria-label", `${title}, ${scope}: ` + HEALTH.map(h => `${h.label} ${row[h.key]}`).join(", "));
    let a = 0, paths = "";
    HEALTH.forEach(h => {
      const v = row[h.key]; if (!v) return;
      const a1 = a + v / total * Math.PI * 2;
      paths += `<path d="${arc(90, 90, 86, a, a1)}" fill="${h.color}" data-k="${h.key}"/>`;
      a = a1;
    });
    svg.innerHTML = paths;
    legend.innerHTML = HEALTH.map(h => `
      <li><span class="sw" style="background:${h.color}"></span><span>${h.label}</span>
      <span class="num">${row[h.key]} · ${Math.round(row[h.key] / total * 100)}%</span></li>`).join("");
    rows.forEach(r => r.classList.toggle("sel", r.dataset.name === name));
    svg.querySelectorAll("path").forEach(p => {
      const h = HEALTH.find(x => x.key === p.dataset.k);
      p.addEventListener("mouseenter", e => {
        svg.classList.add("hovering"); p.classList.add("active");
        showTip(e, `${scope} · ${h.label}<br><b>${row[h.key]}</b> customers (${Math.round(row[h.key] / total * 100)}%)`);
      });
      p.addEventListener("mousemove", moveTip);
      p.addEventListener("mouseleave", () => { svg.classList.remove("hovering"); p.classList.remove("active"); hideTip(); });
    });
  }
  sel.addEventListener("change", draw);
  rows.forEach(r => r.addEventListener("click", () => {
    sel.value = sel.value === r.dataset.name ? "__all" : r.dataset.name; draw();
  }));
  draw();
}

renderPieCard("by-vertical", "Customer health by vertical", "Customer count by health status", "Vertical", BY_VERTICAL);
renderPieCard("by-stage", "Customer health by stage", "Series A, Mid Market, Enterprise", "Stage", BY_STAGE);
</script>
</body>
</html>
